type CrowdfundingCompleted @entity(immutable: true) {
  id: Bytes!
  crowdfundingId: BigInt! # uint256
  totalAmount: BigInt! # uint256
  excessAmount: BigInt! # uint256
  timestamp: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

