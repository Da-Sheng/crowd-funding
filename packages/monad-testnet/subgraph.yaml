specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Crowdfunding
    network: monad-testnet
    source:
      address: "0x767e5aCf95e71C55762145fF5B7Af22b882f667a"
      abi: Crowdfunding
      startBlock: 28930899
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CrowdfundingCompleted
        - CrowdfundingCreated
        - CrowdfundingExpired
        - CrowdfundingParticipated
        - FundsReturned
        - FundsWithdrawn
        - Paused
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - StakingRewardDistributed
        - Unpaused
      abis:
        - name: Crowdfunding
          file: ./abis/Crowdfunding.json
      eventHandlers:
        - event: CrowdfundingCompleted(indexed uint256,uint256,uint256,uint256)
          handler: handleCrowdfundingCompleted
        - event: CrowdfundingCreated(indexed uint256,indexed address,indexed address,uint256,uint256,string,string,bytes,uint256)
          handler: handleCrowdfundingCreated
        - event: CrowdfundingExpired(indexed uint256,uint256,uint256)
          handler: handleCrowdfundingExpired
        - event: CrowdfundingParticipated(indexed uint256,indexed address,uint256,string,uint256)
          handler: handleCrowdfundingParticipated
        - event: FundsReturned(indexed uint256,indexed address,uint256,uint256)
          handler: handleFundsReturned
        - event: FundsWithdrawn(indexed uint256,indexed address,uint256,uint256)
          handler: handleFundsWithdrawn
        - event: Paused(address)
          handler: handlePaused
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: StakingRewardDistributed(indexed uint256,uint256,uint256,uint256)
          handler: handleStakingRewardDistributed
        - event: Unpaused(address)
          handler: handleUnpaused
      file: ./src/crowdfunding.ts
