<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF2F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEE2E2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGradient)" />
  
  <!-- 主爱心 -->
  <path d="M50 75 C50 75, 25 55, 25 40 C25 30, 32 25, 40 25 C45 25, 50 30, 50 30 C50 30, 55 25, 60 25 C68 25, 75 30, 75 40 C75 55, 50 75, 50 75 Z" fill="url(#heartGradient)" stroke="white" stroke-width="2"/>
  
  <!-- 小装饰爱心 -->
  <path d="M30 30 C30 30, 20 25, 20 20 C20 17, 22 15, 24 15 C25 15, 26 16, 26 16 C26 16, 27 15, 28 15 C30 15, 32 17, 32 20 C32 25, 26 30, 26 30 Z" fill="white" opacity="0.8"/>
  
  <path d="M80 65 C80 65, 75 62, 75 59 C75 57, 76 56, 77 56 C78 56, 78 57, 78 57 C78 57, 79 56, 80 56 C81 56, 82 57, 82 59 C82 62, 78 65, 78 65 Z" fill="white" opacity="0.7"/>
  
  <!-- 闪光效果 -->
  <circle cx="42" cy="38" r="2" fill="white" opacity="0.9"/>
  <circle cx="38" cy="42" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="55" cy="40" r="1" fill="white" opacity="0.8"/>
  
  <!-- 外圈装饰 -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#heartGradient)" stroke-width="1" opacity="0.3" stroke-dasharray="2,4"/>
</svg>